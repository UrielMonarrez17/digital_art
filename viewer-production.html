<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Obra Colectiva - Exhibición</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.1/pixi.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #artFrame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: clamp(14px, 3vw, 32px) solid transparent;
      border-image: linear-gradient(135deg, #A0826D 0%, #8B6F47 50%, #6F5536 100%) 1;
      box-shadow: inset 0 0 0 3px #654321, inset 0 0 35px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 50;
    }

    #voteNotification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.95);
      backdrop-filter: blur(12px);
      color: white;
      padding: 24px 48px;
      border-radius: 20px;
      font: bold clamp(22px, 4vw, 34px) sans-serif;
      z-index: 100;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      display: none;
      animation: votePopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #voteNotification .voterId {
      font-size: clamp(14px, 2.5vw, 18px);
      margin-top: 8px;
      opacity: 0.92;
      font-weight: normal;
    }

    @keyframes votePopIn {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    #voteCounter {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font: 900 clamp(80px, 16vw, 150px) sans-serif;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 35px rgba(16, 185, 129, 0.85);
      z-index: 99;
      display: none;
      pointer-events: none;
      animation: counterPulse 0.6s ease-out;
    }

    @keyframes counterPulse {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
    }
  </style>
</head>
<body>

<div id="artFrame"></div>

<div id="voteNotification">
  <div>¡Gracias por participar! ✨</div>
  <div class="voterId" id="voterIdDisplay"></div>
</div>

<div id="voteCounter"></div>

<script>
(function() {
  'use strict';

  const urlParams = new URLSearchParams(window.location.search);
  const OBRA_ID = urlParams.get('obra') || 'obra-demo';
  const FIT_MODE = urlParams.get('fit') || 'cover';

  const CONFIG = {
    OBRA_ID,
    FIT_MODE,
    FIREBASE: {
      apiKey: "AIzaSyCupqNYoP5sNYrbCCcq11M-CJkqmdaXmz8",
      authDomain: "arte-digital-d704e.firebaseapp.com",
      databaseURL: "https://arte-digital-d704e-default-rtdb.firebaseio.com",
      projectId: "arte-digital-d704e",
    },
    TIMING: {
      VOTE_COUNTER_DISPLAY: 900,
      VOTE_NOTIFICATION_DISPLAY: 2200,
      HIGHLIGHT_AUTO_DISMISS: 8000,
      PULSE_CYCLE_DURATION: 1800,
    },
    HIGHLIGHT: {
      MIN_BORDER_WIDTH: 2.5,
      MAX_BORDER_WIDTH: 4.0,
      BORDER_COLOR: 0x10b981,
      FILL_OPACITY: 0.08,
      MIN_ALPHA: 0.4,
      MAX_ALPHA: 0.85,
    }
  };

  firebase.initializeApp(CONFIG.FIREBASE);
  const db = firebase.database();

  const state = {
    manifest: null,
    targetVotes: 100,
    currentVotes: 0,
    revealedCount: 0,
    previousVoteCount: 0,
    lastVoterId: '',
    tileElements: [],
    lastRevealedTiles: [],
    notificationQueue: [],
    isDisplayingNotification: false,
  };

  let app = null;
  let container = null;
  let imageSprite = null;
  let maskGraphics = null;
  let highlightGraphics = null;
  let pulseAnimationId = null;
  let highlightTimeoutId = null;

  function queueVoteNotification(voteNumber, voterId = '') {
    state.notificationQueue.push({ voteNumber, voterId });
    processNotificationQueue();
  }

  function processNotificationQueue() {
    if (state.isDisplayingNotification || state.notificationQueue.length === 0) return;
    
    state.isDisplayingNotification = true;
    const { voteNumber, voterId } = state.notificationQueue.shift();

    const notification = document.getElementById('voteNotification');
    const counter = document.getElementById('voteCounter');
    const voterIdDisplay = document.getElementById('voterIdDisplay');

    if (voterId) {
      voterIdDisplay.textContent = `ID: ${voterId}`;
      voterIdDisplay.style.display = 'block';
    } else {
      voterIdDisplay.style.display = 'none';
    }

    counter.textContent = voteNumber;
    counter.style.display = 'block';
    notification.style.display = 'block';

    setTimeout(() => {
      counter.style.display = 'none';
    }, CONFIG.TIMING.VOTE_COUNTER_DISPLAY);

    setTimeout(() => {
      notification.style.display = 'none';
      state.isDisplayingNotification = false;
      processNotificationQueue();
    }, CONFIG.TIMING.VOTE_NOTIFICATION_DISPLAY);
  }

  async function initializePixiApp() {
    app = new PIXI.Application();
    await app.init({
      width: window.innerWidth,
      height: window.innerHeight,
      background: '#000000',
      antialias: true,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true
    });

    const canvas = app.canvas;
    Object.assign(canvas.style, {
      position: 'fixed',
      top: '0',
      left: '0',
      width: '100vw',
      height: '100vh',
      display: 'block'
    });
    document.body.appendChild(canvas);

    container = new PIXI.Container();
    app.stage.addChild(container);

    loadManifestAndInitialize();
  }

  function getTransformParams() {
    const imgW = state.manifest.meta.w || 1280;
    const imgH = state.manifest.meta.h || 720;
    const scaleX = app.screen.width / imgW;
    const scaleY = app.screen.height / imgH;
    const scale = CONFIG.FIT_MODE === 'contain' ? Math.min(scaleX, scaleY) : Math.max(scaleX, scaleY);
    const offsetX = (app.screen.width - imgW * scale) / 2;
    const offsetY = (app.screen.height - imgH * scale) / 2;
    return { imgW, imgH, scale, offsetX, offsetY };
  }

  function initializeViewer() {
    if (!app || !state.manifest || !state.manifest.meta || !state.manifest.meta.sourceDataUrl) return;

    container.removeChildren();
    imageSprite = null;
    maskGraphics = null;

    const { imgW, imgH, scale, offsetX, offsetY } = getTransformParams();

    PIXI.Assets.load(state.manifest.meta.sourceDataUrl).then((texture) => {
      imageSprite = new PIXI.Sprite(texture);
      imageSprite.width = imgW * scale;
      imageSprite.height = imgH * scale;
      imageSprite.x = offsetX;
      imageSprite.y = offsetY;

      maskGraphics = new PIXI.Graphics();
      imageSprite.mask = maskGraphics;

      container.addChild(imageSprite);
      container.addChild(maskGraphics);

      highlightGraphics = new PIXI.Graphics();
      container.addChild(highlightGraphics);

      state.tileElements = state.manifest.elements || [];
      state.revealedCount = 0;

      revealTiles(true);
    }).catch(err => {
      console.error('Error cargando textura:', err);
    });
  }

  function revealTiles(forceFullRedraw = false) {
    if (!imageSprite || !maskGraphics || !state.manifest || !app) return;

    const totalTiles = state.tileElements.length;
    const tilesPerVote = totalTiles / (state.targetVotes || 1);

    let tilesToReveal = state.currentVotes >= state.targetVotes 
      ? totalTiles 
      : Math.min(totalTiles, Math.ceil(state.currentVotes * tilesPerVote));

    const { scale, offsetX, offsetY } = getTransformParams();

    if (forceFullRedraw || tilesToReveal < state.revealedCount) {
      maskGraphics.clear();
      state.revealedCount = 0;
      state.lastRevealedTiles = [];
    }

    if (tilesToReveal === 0) {
      maskGraphics.clear();
      state.revealedCount = 0;
      return;
    }

    const startIndex = state.revealedCount;
    state.lastRevealedTiles = [];

    for (let i = startIndex; i < tilesToReveal; i++) {
      const el = state.tileElements[i];
      if (!el || !el.poly) continue;

      const poly = el.poly.map(([x, y]) => [
        x * scale + offsetX,
        y * scale + offsetY
      ]).flat();

      maskGraphics.poly(poly).fill(0xFFFFFF);
      state.lastRevealedTiles.push(el);
    }

    state.revealedCount = tilesToReveal;

    if (state.lastRevealedTiles.length > 0) {
      highlightNewTiles();
    }
  }

  function highlightNewTiles() {
    if (!highlightGraphics || state.lastRevealedTiles.length === 0) return;
    if (!app || !state.manifest) return;

    if (pulseAnimationId) {
      cancelAnimationFrame(pulseAnimationId);
      pulseAnimationId = null;
    }
    if (highlightTimeoutId) {
      clearTimeout(highlightTimeoutId);
      highlightTimeoutId = null;
    }

    const startTime = performance.now();
    const lastTile = state.lastRevealedTiles[state.lastRevealedTiles.length - 1];

    function animatePulse() {
      const elapsed = performance.now() - startTime;
      const cycle = (elapsed % CONFIG.TIMING.PULSE_CYCLE_DURATION) / CONFIG.TIMING.PULSE_CYCLE_DURATION;
      const pulse = Math.sin(cycle * Math.PI * 2) * 0.5 + 0.5;

      const borderWidth = CONFIG.HIGHLIGHT.MIN_BORDER_WIDTH + 
                         (CONFIG.HIGHLIGHT.MAX_BORDER_WIDTH - CONFIG.HIGHLIGHT.MIN_BORDER_WIDTH) * pulse;
      const alpha = CONFIG.HIGHLIGHT.MIN_ALPHA + 
                   (CONFIG.HIGHLIGHT.MAX_ALPHA - CONFIG.HIGHLIGHT.MIN_ALPHA) * pulse;

      highlightGraphics.clear();

      if (lastTile && lastTile.poly) {
        const { scale, offsetX, offsetY } = getTransformParams();
        const poly = lastTile.poly.map(([x, y]) => [
          x * scale + offsetX,
          y * scale + offsetY
        ]).flat();

        highlightGraphics.poly(poly)
          .fill({ color: CONFIG.HIGHLIGHT.BORDER_COLOR, alpha: CONFIG.HIGHLIGHT.FILL_OPACITY })
          .stroke({ width: borderWidth, color: CONFIG.HIGHLIGHT.BORDER_COLOR, alpha });
      }

      pulseAnimationId = requestAnimationFrame(animatePulse);
    }

    animatePulse();

    highlightTimeoutId = setTimeout(() => {
      highlightGraphics.clear();
      if (pulseAnimationId) {
        cancelAnimationFrame(pulseAnimationId);
        pulseAnimationId = null;
      }
    }, CONFIG.TIMING.HIGHLIGHT_AUTO_DISMISS);
  }

  function onResize() {
    if (!app) return;
    app.renderer.resize(window.innerWidth, window.innerHeight);
    if (imageSprite && state.manifest) {
      const { imgW, imgH, scale, offsetX, offsetY } = getTransformParams();
      imageSprite.width = imgW * scale;
      imageSprite.height = imgH * scale;
      imageSprite.x = offsetX;
      imageSprite.y = offsetY;
      revealTiles(true);
    }
  }

  function loadManifestAndInitialize() {
    db.ref(`manifest/${CONFIG.OBRA_ID}`).once('value').then(snap => {
      state.manifest = snap.val();
      if (!state.manifest || !state.manifest.elements) return;
      initializeViewer();
    }).catch(err => {
      console.error('Error cargando manifest:', err);
    });
  }

  db.ref(`stats/${CONFIG.OBRA_ID}`).on('value', snap => {
    const stats = snap.val() || {};

    if (typeof stats.targetVotes === 'number') {
      state.targetVotes = stats.targetVotes;
    }

    const newVoteCount = stats.currentVotes || 0;
    const newVoterId = stats.lastVoterId || '';

    if (newVoteCount > state.previousVoteCount) {
      queueVoteNotification(newVoteCount, newVoterId);
    }

    state.previousVoteCount = newVoteCount;
    state.currentVotes = newVoteCount;
    state.lastVoterId = newVoterId;

    revealTiles(false);
  });

  window.addEventListener('resize', onResize);
  initializePixiApp();
})();
</script>
</body>
</html>
